[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "safeops-agent"
version = "0.1.0"
description = "Durable operations agents with deterministic authorization"
requires-python = ">=3.12"
dependencies = ["langgraph>=1.0,<2", "langgraph-checkpoint-postgres>=3,<4", "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy[asyncio]>=2.0,<3", "alembic>=1.14,<2", "psycopg[binary,pool]>=3.2,<4", "httpx>=0.28,<1", "mcp>=1.12,<2"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.11", "mypy>=1.15"]
[project.scripts]
safeops = "safeops.cli:main"
[tool.hatch.build.targets.wheel]
packages = ["src/safeops"]
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: requires a migrated PostgreSQL test database"]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]
[tool.mypy]
python_version = "3.12"
files = ["src/safeops"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
plugins = ["pydantic.mypy"]
