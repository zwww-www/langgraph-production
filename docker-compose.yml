services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: safeops
      POSTGRES_PASSWORD: safeops
      POSTGRES_DB: safeops
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safeops -d safeops"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    build: .
    command: ["safeops", "migrate"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://safeops:safeops@postgres:5432/safeops
    depends_on:
      postgres: {condition: service_healthy}
  seed:
    build: .
    command: ["safeops", "demo", "--seed-only"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://safeops:safeops@postgres:5432/safeops
    depends_on:
      migrate: {condition: service_completed_successfully}
  backend:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://safeops:safeops@postgres:5432/safeops
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      seed: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 5s
      timeout: 3s
      retries: 12
  frontend:
    build: ./apps/web
    environment:
      BACKEND_URL: http://backend:8000
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      backend: {condition: service_healthy}
volumes:
  postgres-data:
